<!DOCTYPE html>
<html>

<head>

    <title>{{ page_title }} | RShare</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8f6;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }

        h1 {
            color: #064d2c;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 18px;
            border: 1px solid #d5dfda;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #087f3f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #087f3f;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            {{ page_title }}
        </h1>

        <p>
            Share something useful with your RCSS community.
        </p>

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Save Listing
            </button>

        </form>

        <a
            href="{% url 'explore' %}"
            class="back"
        >
            ← Back to Explore
        </a>

    </div>

</div>

</body>

</html>
