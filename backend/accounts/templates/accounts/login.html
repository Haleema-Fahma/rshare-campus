<!DOCTYPE html>
<html>
<head>

    <title>Login | RShare</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            color: #075b35;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #087f3f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        a {
            color: #087f3f;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>🌱 RShare</h1>

    <p>Welcome back to the RCSS sharing community.</p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">
            Create Account
        </a>
    </p>

</div>

</body>
</html>
